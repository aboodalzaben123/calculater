<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حاسبة مكتبية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: a desk calculator body centred on the page. On wide screens (iPad landscape) a paper tape sits beside it; on narrow screens the tape opens as a sheet over the calculator. */
:root {
  --bg: #D9DDE2;
  --case: #EDEFF2;
  --case-edge: #BFC5CD;
  --fg: #1E232A;
  --fg-soft: #5B6470;
  --key-num: #FBFBFC;
  --key-num-edge: #B2B9C3;
  --key-num-fg: #1E232A;
  --key-op: #CBD2DC;
  --key-op-edge: #9EA8B6;
  --key-op-fg: #1E232A;
  --key-mem: #DCE0E6;
  --key-mem-edge: #B0B7C2;
  --key-mem-fg: #46505C;
  --key-clear: #C8452D;
  --key-clear-edge: #8C2B19;
  --key-clear-fg: #FFFFFF;
  --key-eq: #0F6B6B;
  --key-eq-edge: #07403F;
  --key-eq-fg: #FFFFFF;
  --lcd: #C7D3B8;
  --lcd-edge: #98A589;
  --lcd-fg: #1B2418;
  --paper: #F8F9F7;
  --paper-fg: #2A2E33;
  --paper-soft: #6A707A;
  --paper-line: #D6D8D2;
  --focus: #1B64C8;
  --shadow: 0 30px 60px -32px rgba(20, 30, 45, .5), 0 1px 0 rgba(255, 255, 255, .8) inset;
  --shadow-paper: 0 18px 40px -26px rgba(20, 30, 45, .45);
  --font-ui: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-lcd: 'Share Tech Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161A;
    --case: #20242A;
    --case-edge: #343A43;
    --fg: #E6E9ED;
    --fg-soft: #98A1AD;
    --key-num: #373D46;
    --key-num-edge: #16191D;
    --key-num-fg: #EEF0F3;
    --key-op: #2A3038;
    --key-op-edge: #121518;
    --key-op-fg: #D5DEEA;
    --key-mem: #292E35;
    --key-mem-edge: #121518;
    --key-mem-fg: #9AA5B3;
    --key-clear: #D4573D;
    --key-clear-edge: #7B291A;
    --key-clear-fg: #FFFFFF;
    --key-eq: #34A29E;
    --key-eq-edge: #14595A;
    --key-eq-fg: #031A19;
    --lcd: #1D2621;
    --lcd-edge: #0C110E;
    --lcd-fg: #C9D8BC;
    --paper: #E6E7E1;
    --paper-fg: #25292E;
    --paper-soft: #646A73;
    --paper-line: #C3C4BC;
    --focus: #7DB6FF;
    --shadow: 0 30px 60px -30px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .05) inset;
    --shadow-paper: 0 18px 40px -24px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161A;
  --case: #20242A;
  --case-edge: #343A43;
  --fg: #E6E9ED;
  --fg-soft: #98A1AD;
  --key-num: #373D46;
  --key-num-edge: #16191D;
  --key-num-fg: #EEF0F3;
  --key-op: #2A3038;
  --key-op-edge: #121518;
  --key-op-fg: #D5DEEA;
  --key-mem: #292E35;
  --key-mem-edge: #121518;
  --key-mem-fg: #9AA5B3;
  --key-clear: #D4573D;
  --key-clear-edge: #7B291A;
  --key-clear-fg: #FFFFFF;
  --key-eq: #34A29E;
  --key-eq-edge: #14595A;
  --key-eq-fg: #031A19;
  --lcd: #1D2621;
  --lcd-edge: #0C110E;
  --lcd-fg: #C9D8BC;
  --paper: #E6E7E1;
  --paper-fg: #25292E;
  --paper-soft: #646A73;
  --paper-line: #C3C4BC;
  --focus: #7DB6FF;
  --shadow: 0 30px 60px -30px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .05) inset;
  --shadow-paper: 0 18px 40px -24px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body, .calc, .tape { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}

.stage {
  position: relative;
  display: flex;
  justify-content: center;
  gap: 22px;
  width: 100%;
  max-width: 940px;
  height: 100%;
  min-height: 560px;
  max-height: 900px;
}

/* ---------- Calculator body ---------- */
.calc {
  flex: 0 1 560px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--case);
  border: 1px solid var(--case-edge);
  border-radius: 28px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding-inline: 4px;
}
.name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--fg);
}
.name small {
  font-weight: 400;
  color: var(--fg-soft);
  margin-inline-start: 8px;
}
.chip {
  font: 500 14px var(--font-ui);
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--case-edge);
  border-radius: 999px;
  padding: 7px 14px;
  min-height: 36px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.chip:active { background: var(--key-mem); }
.tape-open-btn { display: none; }
.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--case-edge);
  border-radius: 999px;
}
.seg button {
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  border: 0;
  background: transparent;
  color: var(--fg-soft);
  font: 500 14px var(--font-ui);
  padding: 0 16px;
  min-height: 34px;
  border-radius: 999px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--case); }
.seg button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (max-width: 520px) { .name { display: none; } .bar { justify-content: space-between; } }

/* ---------- LCD ---------- */
.lcd {
  container-type: inline-size;
  background: var(--lcd);
  color: var(--lcd-fg);
  border: 1px solid var(--lcd-edge);
  border-radius: 14px;
  padding: 10px 18px 8px;
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, .22);
}
.lcd-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  min-height: 24px;
  font: 400 16px var(--font-lcd);
  font-variant-numeric: tabular-nums;
}
.lcd-top .expr {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  opacity: .78;
}
.lcd-top .expr[dir="rtl"], .lcd-top .expr.msg { font-family: var(--font-ui); font-size: 14px; }
.flags { display: flex; align-items: center; gap: 10px; flex: none; font-weight: 400; }
.flags span { opacity: .12; }
.flags span.on { opacity: 1; }
.mode {
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  font: 400 13px var(--font-lcd);
  letter-spacing: .04em;
  color: inherit;
  background: transparent;
  border: 1px solid currentColor;
  border-radius: 7px;
  padding: 0 9px;
  min-height: 30px;
  opacity: .5;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.calc[data-mode="sci"] .lcd-top .expr { text-overflow: clip; font-size: 18px; opacity: .9; }
.calc[data-mode="sci"] .lcd-top .expr.msg { font-size: 14px; }
.mode.show { opacity: .85; }
.mode.on { opacity: 1; background: var(--lcd-fg); color: var(--lcd); }
.mode:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num-wrap {
  height: 88px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
}
.num {
  font-family: var(--font-lcd);
  font-size: min(78px, calc(100cqw / (var(--n, 8) * .6)));
  line-height: 1;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.num.is-frac {
  font-size: min(60px, calc(100cqw / (var(--n, 8) * .6)));
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .14em;
}
.num .lead { line-height: 1; }
.num .fr {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  font-size: .5em;
  line-height: 1.05;
}
.num .fr .top { padding: 0 .2em .06em; border-bottom: .09em solid currentColor; }
.num .fr .bot { padding: .06em .2em 0; }

/* ---------- Keys ---------- */
.keys {
  flex: 1;
  min-height: 0;
  margin-top: 16px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-template-rows: minmax(0, .62fr) repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.k {
  --k-bg: var(--key-num);
  --k-edge: var(--key-num-edge);
  --k-fg: var(--key-num-fg);
  appearance: none;
  -webkit-appearance: none;
  min-width: 0;
  min-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--font-ui);
  font-size: clamp(22px, 4.4vmin, 36px);
  font-weight: 500;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 0 var(--k-edge), 0 8px 12px -6px rgba(0, 0, 0, .3);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  top: 0;
}
.k:active, .k.pressed {
  top: 3px;
  box-shadow: 0 1px 0 var(--k-edge), 0 2px 4px -2px rgba(0, 0, 0, .3);
}
.k:focus-visible, .chip:focus-visible, .row:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.k.op { --k-bg: var(--key-op); --k-edge: var(--key-op-edge); --k-fg: var(--key-op-fg); font-size: clamp(26px, 5vmin, 40px); }
.k.fn { --k-bg: var(--key-op); --k-edge: var(--key-op-edge); --k-fg: var(--key-op-fg); }
.k.mem {
  --k-bg: var(--key-mem);
  --k-edge: var(--key-mem-edge);
  --k-fg: var(--key-mem-fg);
  font-size: clamp(14px, 2.4vmin, 19px);
  font-weight: 600;
  letter-spacing: .05em;
}
.k.sci {
  --k-bg: var(--key-mem);
  --k-edge: var(--key-mem-edge);
  --k-fg: var(--key-op-fg);
  font-size: clamp(15px, 2.8vmin, 23px);
  font-weight: 600;
  letter-spacing: .02em;
}
/* Basic mode shows the plain calculator; scientific mode adds the three function rows. */
.calc:not([data-mode="sci"]) .k.sci,
.calc:not([data-mode="sci"]) .mode { display: none; }
.calc[data-mode="sci"] .keys { grid-template-rows: repeat(4, minmax(0, .62fr)) repeat(4, minmax(0, 1fr)); }
.k sup { font-size: .62em; line-height: 0; position: relative; top: -.45em; margin-inline-start: .06em; }
.k sup.pre { margin-inline: 0 .06em; }
.k.clr { --k-bg: var(--key-clear); --k-edge: var(--key-clear-edge); --k-fg: var(--key-clear-fg); font-weight: 600; }
.k.eq { --k-bg: var(--key-eq); --k-edge: var(--key-eq-edge); --k-fg: var(--key-eq-fg); font-size: clamp(28px, 5.4vmin, 44px); }
.k svg { width: 1.1em; height: 1.1em; display: block; }

/* ---------- Paper tape ---------- */
.tape {
  flex: 0 1 300px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--paper-fg);
  border-radius: 6px 6px 18px 18px;
  box-shadow: var(--shadow-paper);
  overflow: hidden;
}
.tape-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 16px 10px;
  border-bottom: 2px dashed var(--paper-line);
}
.tape-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
.tape-head .acts { display: flex; gap: 8px; }
.tape .chip { color: var(--paper-fg); border-color: var(--paper-line); font-size: 13px; padding: 5px 12px; min-height: 34px; }
.tape .chip:active { background: var(--paper-line); }
.tape .close-btn { display: none; }
.tape-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 8px 8px 14px;
  display: flex;
  flex-direction: column;
}
.tape-empty {
  margin: auto;
  padding: 24px 20px;
  text-align: center;
  font-size: 14px;
  line-height: 1.7;
  color: var(--paper-soft);
}
.row {
  all: unset;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  padding: 9px 10px;
  border-radius: 8px;
  border-bottom: 1px dotted var(--paper-line);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.row:active { background: var(--paper-line); }
.row .expr { font: 400 14px var(--font-lcd); color: var(--paper-soft); font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.row .res { font: 400 24px var(--font-lcd); font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }

/* ---------- Narrow screens: tape becomes a sheet ---------- */
@media (max-width: 899px) {
  .tape-open-btn { display: inline-flex; align-items: center; }
  .tape {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 10;
    flex: none;
    border-radius: 22px;
  }
  .stage.tape-open .tape { display: flex; }
  .tape .close-btn { display: inline-flex; align-items: center; }
}
@media (max-width: 480px) {
  .calc { padding: 12px; border-radius: 22px; }
  .keys { gap: 8px; }
  .num-wrap { height: 76px; }
}
@media (max-height: 640px) {
  .num-wrap { height: 64px; }
  .keys { margin-top: 10px; gap: 7px; }
}
</style>

<main class="stage" id="stage" dir="ltr">
  <section class="calc" id="calc" data-mode="basic" aria-label="الحاسبة">
    <div class="bar">
      <div class="name">حاسبة مكتبية<small>12 خانة</small></div>
      <div class="seg" role="group" aria-label="نوع الحاسبة">
        <button type="button" data-m="basic" aria-pressed="true">عادية</button>
        <button type="button" data-m="sci" aria-pressed="false">علمية</button>
      </div>
      <button class="chip tape-open-btn" id="tapeOpen" type="button">الشريط</button>
    </div>

    <div class="lcd">
      <div class="lcd-top">
        <span class="expr" id="expr"></span>
        <span class="flags">
          <button class="mode" id="mInv" data-k="INV" type="button" aria-label="الدوال البديلة (الجيب العكسي والجذور والأسس)">SHIFT</button>
          <button class="mode show" id="mDeg" data-k="DEG" type="button" aria-label="التبديل بين الدرجات والراديان">DEG</button>
          <span id="fM" aria-hidden="true">M</span><span id="fE" aria-hidden="true">E</span>
        </span>
      </div>
      <div class="num-wrap">
        <div class="num" id="num" role="status" aria-live="polite">0</div>
      </div>
    </div>

    <div class="keys" role="group" aria-label="المفاتيح">
      <button class="k sci" id="kSin" data-k="SIN" type="button" aria-label="جيب">sin</button>
      <button class="k sci" id="kCos" data-k="COS" type="button" aria-label="جيب التمام">cos</button>
      <button class="k sci" id="kTan" data-k="TAN" type="button" aria-label="ظل">tan</button>
      <button class="k sci" data-k="LPAREN" type="button" aria-label="فتح قوس">(</button>
      <button class="k sci" data-k="RPAREN" type="button" aria-label="إغلاق قوس">)</button>

      <button class="k sci" data-k="LN" data-alt="e<sup>x</sup>" type="button" aria-label="اللوغاريتم الطبيعي">ln</button>
      <button class="k sci" data-k="LOG" data-alt="10<sup>x</sup>" type="button" aria-label="اللوغاريتم العشري">log</button>
      <button class="k sci" data-k="SQ" data-alt="√" type="button" aria-label="تربيع">x<sup>2</sup></button>
      <button class="k sci" data-k="CUBE" data-alt="∛" type="button" aria-label="تكعيب">x<sup>3</sup></button>
      <button class="k sci" data-k="POW" data-alt="<sup class='pre'>x</sup>√" type="button" aria-label="x أس y">x<sup>y</sup></button>

      <button class="k sci" data-k="PI" type="button" aria-label="باي">π</button>
      <button class="k sci" data-k="E" type="button" aria-label="الثابت e">e</button>
      <button class="k sci" data-k="RECIP" type="button" aria-label="مقلوب العدد">x<sup>−1</sup></button>
      <button class="k sci" data-k="FACT" type="button" aria-label="مضروب العدد">n!</button>
      <button class="k sci" data-k="FRAC" type="button" aria-label="تحويل بين الرقم العشري والكسر">a⁄b</button>

      <button class="k mem" data-k="MC" type="button" aria-label="مسح الذاكرة">MC</button>
      <button class="k mem" data-k="MR" type="button" aria-label="استدعاء الذاكرة">MR</button>
      <button class="k mem" data-k="M-" type="button" aria-label="طرح من الذاكرة">M−</button>
      <button class="k mem" data-k="M+" type="button" aria-label="جمع إلى الذاكرة">M+</button>
      <button class="k clr" data-k="C" type="button" aria-label="مسح الكل">C</button>

      <button class="k" data-k="7" type="button">7</button>
      <button class="k" data-k="8" type="button">8</button>
      <button class="k" data-k="9" type="button">9</button>
      <button class="k op" data-k="/" type="button" aria-label="قسمة">÷</button>
      <button class="k fn" data-k="BS" type="button" aria-label="حذف آخر رقم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m13 10 4 4m0-4-4 4"/></svg>
      </button>

      <button class="k" data-k="4" type="button">4</button>
      <button class="k" data-k="5" type="button">5</button>
      <button class="k" data-k="6" type="button">6</button>
      <button class="k op" data-k="*" type="button" aria-label="ضرب">×</button>
      <button class="k fn" data-k="%" type="button" aria-label="نسبة مئوية">%</button>

      <button class="k" data-k="1" type="button">1</button>
      <button class="k" data-k="2" type="button">2</button>
      <button class="k" data-k="3" type="button">3</button>
      <button class="k op" data-k="-" type="button" aria-label="طرح">−</button>
      <button class="k fn" data-k="SQRT" type="button" aria-label="جذر تربيعي">√</button>

      <button class="k fn" data-k="NEG" type="button" aria-label="تغيير الإشارة">±</button>
      <button class="k" data-k="0" type="button">0</button>
      <button class="k" data-k="." type="button" aria-label="فاصلة عشرية">.</button>
      <button class="k op" data-k="+" type="button" aria-label="جمع">+</button>
      <button class="k eq" data-k="=" type="button" aria-label="يساوي">=</button>
    </div>
  </section>

  <aside class="tape" id="tape" aria-label="شريط العمليات">
    <div class="tape-head">
      <h2>الشريط</h2>
      <div class="acts">
        <button class="chip" id="tapeClear" type="button">مسح</button>
        <button class="chip close-btn" id="tapeClose" type="button">إغلاق</button>

    <div class="tape-list" id="tapeList">
      <p class="tape-empty" id="tapeEmpty" dir="rtl">لا توجد عمليات بعد.<br>كل عملية تنتهي تظهر هنا مثل شريط الحاسبة المطبوع، واضغط على أي نتيجة لاستخدامها.</p>
    </div>
  </aside>
</main>

<script>
/* ---------- Core: chain arithmetic like a desk calculator ---------- */
function createCalc(init) {
  init = init || {};
  var MAXD = 12;
  var SYM = { '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^', 'r': 'ʸ√' };
  var ERR = {
    div0: 'لا يمكن القسمة على صفر',
    neg: 'لا يوجد جذر لعدد سالب',
    overflow: 'النتيجة أكبر من 12 خانة',
    undef: 'القيمة غير معرّفة',
    domain: 'خارج مجال الدالة',
    syntax: 'العملية مكتوبة بشكل ناقص'
  };
  var NOTICE = {
    nofrac: 'لا يوجد كسر مناسب لهذا الرقم',
    int: 'العدد صحيح وليس فيه كسر'
  };

  var S = {
    cur: '0', acc: null, op: null,
    awaiting: false, fresh: true, justEq: false,
    lastOp: null, lastB: null, lastExpr: '',
    mem: typeof init.mem === 'number' && isFinite(init.mem) ? init.mem : 0,
    deg: init.deg === false ? false : true,
    inv: false,
    mode: 'basic',
    fracMode: null, frac: null, notice: '',
    err: null,
    tape: []
  };
  if (Array.isArray(init.tape)) {
    init.tape.forEach(function (r) {
      if (r && typeof r.expr === 'string' && typeof r.res === 'string' && /^-?\d+(\.\d+)?$/.test(r.res)) {
        S.tape.push({ expr: r.expr, res: r.res });
      }
    });
    S.tape = S.tape.slice(-80);
  }

  function round(n) { return parseFloat(n.toPrecision(12)); }

  function toStr(n) {
    if (!isFinite(n)) throw new Error('overflow');
    n = round(n);
    if (Math.abs(n) >= 1e12) throw new Error('overflow');
    var s = String(n);
    if (/e/i.test(s)) s = n.toFixed(12).replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0' || s === '' || s === '-') s = '0';
    return s;
  }

  function fmt(s) {
    var neg = s.charAt(0) === '-';
    if (neg) s = s.slice(1);
    var parts = s.split('.');
    var i = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + i + (parts.length > 1 ? '.' + parts[1] : '');
  }

  function f(n) { return fmt(toStr(n)); }
  function digits(s) { return s.replace(/[-.]/g, '').length; }
  function val() { return parseFloat(S.cur); }

  function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a; }

  function buildFrac(neg, n, d) {
    var w = Math.floor(n / d);
    return { kind: 'frac', neg: neg, n: n, d: d, whole: w, rem: n - w * d };
  }

  /* Decimal -> fraction. Short decimals are converted exactly (0.125 = 1/8);
     longer ones, such as 1/3 shown as 0.333333333333, use continued fractions. */
  function toFraction(x) {
    var neg = x < 0, ax = Math.abs(x);
    var parts = toStr(ax).split('.');
    if (parts.length === 1) return { kind: 'int' };
    var k = parts[1].length, n, d;
    if (k <= 9) {
      n = parseInt(parts[0] + parts[1], 10);
      d = Math.pow(10, k);
      var g = gcd(n, d);
      n /= g; d /= g;
      if (d <= 999999) return buildFrac(neg, n, d);
    }
    var h0 = 0, h1 = 1, k0 = 1, k1 = 0, y = ax, tol = ax * 6e-12;
    for (var i = 0; i < 40; i++) {
      var a = Math.floor(y), h = a * h1 + h0, kk = a * k1 + k0;
      if (kk > 9999 || h > 999999999) break;
      h0 = h1; h1 = h; k0 = k1; k1 = kk;
      if (Math.abs(ax - h / kk) <= tol) return buildFrac(neg, h, kk);
      var fr = y - a;
      if (fr < 1e-12) break;
      y = 1 / fr;
    }
    return null;
  }

  function fracParts() {
    var fr = S.frac, sgn = fr.neg ? '-' : '';
    if (S.fracMode === 'mixed') {
      return { lead: sgn + (fr.whole > 0 ? fmt(String(fr.whole)) : ''), top: fmt(String(fr.rem)), bot: fmt(String(fr.d)) };
    }
    return { lead: sgn, top: fmt(String(fr.n)), bot: fmt(String(fr.d)) };
  }

  function power(a, b) {
    if (a === 0 && b <= 0) throw new Error('undef');
    var r = Math.pow(a, b);
    if (isNaN(r)) throw new Error('domain');
    return r;
  }

  /* a to the 1/b: the b-th root of a. Odd roots of negatives are allowed. */
  function root(a, b) {
    if (b === 0 || (a === 0 && b < 0)) throw new Error('undef');
    if (a < 0) {
      if (Number.isInteger(b) && Math.abs(b) % 2 === 1) return -Math.pow(-a, 1 / b);
      throw new Error('domain');
    }
    return Math.pow(a, 1 / b);
  }

  function compute(a, op, b) {
    if (op === '+') return a + b;
    if (op === '-') return a - b;
    if (op === '*') return a * b;
    if (op === '^') return power(a, b);
    if (op === 'r') return root(a, b);
    if (b === 0) throw new Error('div0');
    return a / b;
  }

  function pushTape(expr, res) {
    S.lastExpr = expr;
    S.tape.push({ expr: expr, res: res });
    if (S.tape.length > 80) S.tape.shift();
  }

  function reset() {
    S.cur = '0'; S.acc = null; S.op = null;
    S.awaiting = false; S.fresh = true; S.justEq = false;
    S.lastOp = null; S.lastB = null; S.lastExpr = '';
    S.inv = false; S.fracMode = null; S.frac = null; S.notice = '';
    S.err = null;
  }

  function handle(k) {
    var v, r, rs, b, a;

    S.notice = '';
    if (k !== 'FRAC' && k !== 'DEG' && k !== 'INV') S.fracMode = null;
    if (k === 'POW') k = '^';
    if (k === 'ROOT') k = 'r';

    if (k === 'LN' || k === 'LOG' || k === 'EXP' || k === 'TEN' || k === 'SQ' ||
        k === 'CBRT' || k === 'RECIP' || k === 'FACT') {
      v = val();
      var label;
      if (k === 'LN') {
        if (v <= 0) throw new Error('domain');
        r = Math.log(v); label = 'ln(' + f(v) + ')';
      } else if (k === 'LOG') {
        if (v <= 0) throw new Error('domain');
        r = Math.log10(v); label = 'log(' + f(v) + ')';
      } else if (k === 'EXP') {
        r = Math.exp(v); label = 'e^(' + f(v) + ')';
      } else if (k === 'TEN') {
        r = Math.pow(10, v); label = '10^(' + f(v) + ')';
      } else if (k === 'SQ') {
        r = v * v; label = f(v) + '²';
      } else if (k === 'CBRT') {
        r = Math.cbrt(v); label = '∛(' + f(v) + ')';
      } else if (k === 'RECIP') {
        if (v === 0) throw new Error('div0');
        r = 1 / v; label = '1/(' + f(v) + ')';
      } else {
        if (v < 0 || !Number.isInteger(v)) throw new Error('domain');
        if (v > 20) throw new Error('overflow');
        r = 1;
        for (var q = 2; q <= v; q++) r *= q;
        label = f(v) + '!';
      }
      rs = toStr(r);
      pushTape(label, rs);
      S.cur = rs; S.fresh = true; S.awaiting = false; S.justEq = false;
      return;
    }

    if (k === 'FRAC') {
      if (S.fracMode === 'mixed') { S.fracMode = 'improper'; return; }
      if (S.fracMode === 'improper') { S.fracMode = null; return; }
      var fr = toFraction(val());
      if (fr === null) { S.notice = 'nofrac'; return; }
      if (fr.kind === 'int') { S.notice = 'int'; return; }
      S.frac = fr;
      S.fracMode = fr.whole > 0 ? 'mixed' : 'improper';
      S.fresh = true; S.awaiting = false;
      return;
    }

    if (k === 'PI') {
      S.cur = toStr(Math.PI); S.fresh = true; S.awaiting = false; S.justEq = false;
      return;
    }

    if (k === 'DEG') { S.deg = !S.deg; return; }
    if (k === 'INV') { S.inv = !S.inv; return; }

    if (k === 'SIN' || k === 'COS' || k === 'TAN') {
      v = val();
      var nm = k.toLowerCase(), arg;
      if (!S.inv) {
        var x = S.deg ? v * Math.PI / 180 : v;
        if (k === 'SIN') r = Math.sin(x);
        else if (k === 'COS') r = Math.cos(x);
        else {
          if (Math.abs(Math.cos(x)) < 1e-10) throw new Error('undef');
          r = Math.tan(x);
        }
        arg = f(v) + (S.deg ? '°' : '');
      } else {
        if (k !== 'TAN' && Math.abs(v) > 1) throw new Error('domain');
        r = k === 'SIN' ? Math.asin(v) : k === 'COS' ? Math.acos(v) : Math.atan(v);
        if (S.deg) r = r * 180 / Math.PI;
        nm += '⁻¹';
        arg = f(v);
      }
      rs = toStr(r);
      pushTape(nm + '(' + arg + ')', rs);
      S.cur = rs; S.fresh = true; S.awaiting = false; S.justEq = false; S.inv = false;
      return;
    }

    if (/^[0-9]$/.test(k)) {
      if (S.fresh) { S.cur = k; S.fresh = false; S.justEq = false; }
      else if (digits(S.cur) < MAXD) { S.cur = S.cur === '0' ? k : S.cur + k; }
      S.awaiting = false;
      return;
    }

    if (k === '.') {
      if (S.fresh) { S.cur = '0.'; S.fresh = false; S.justEq = false; }
      else if (S.cur.indexOf('.') < 0 && digits(S.cur) < MAXD) { S.cur += '.'; }
      S.awaiting = false;
      return;
    }

    if (k === '+' || k === '-' || k === '*' || k === '/' || k === '^' || k === 'r') {
      if (S.op !== null && S.awaiting) { S.op = k; return; }
      v = val();
      if (S.op !== null) {
        r = compute(S.acc, S.op, v);
        rs = toStr(r);
        pushTape(f(S.acc) + ' ' + SYM[S.op] + ' ' + f(v), rs);
        S.acc = parseFloat(rs);
        S.cur = rs;
      } else {
        S.acc = v;
      }
      S.op = k; S.awaiting = true; S.fresh = true; S.justEq = false; S.lastOp = null;
      return;
    }

    if (k === '=') {
      if (S.op !== null) {
        b = val();
        rs = toStr(compute(S.acc, S.op, b));
        pushTape(f(S.acc) + ' ' + SYM[S.op] + ' ' + f(b) + ' =', rs);
        S.lastOp = S.op; S.lastB = b;
        S.acc = null; S.op = null;
      } else if (S.lastOp !== null) {
        a = val();
        rs = toStr(compute(a, S.lastOp, S.lastB));
        pushTape(f(a) + ' ' + SYM[S.lastOp] + ' ' + f(S.lastB) + ' =', rs);
      } else {
        return;
      }
      S.cur = rs; S.fresh = true; S.awaiting = false; S.justEq = true;
      return;
    }

    if (k === '%') {
      v = val();
      if (S.op !== null && S.acc !== null && '+-*/'.indexOf(S.op) >= 0) {
        a = S.acc;
        if (S.op === '+') r = a + a * v / 100;
        else if (S.op === '-') r = a - a * v / 100;
        else if (S.op === '*') r = a * v / 100;
        else { if (v === 0) throw new Error('div0'); r = a / v * 100; }
        rs = toStr(r);
        pushTape(f(a) + ' ' + SYM[S.op] + ' ' + f(v) + '% =', rs);
        S.acc = null; S.op = null; S.lastOp = null; S.justEq = true;
      } else {
        rs = toStr(v / 100);
        pushTape(f(v) + '%', rs);
      }
      S.cur = rs; S.fresh = true; S.awaiting = false;
      return;
    }

    if (k === 'SQRT') {
      v = val();
      if (v < 0) throw new Error('neg');
      rs = toStr(Math.sqrt(v));
      pushTape('√' + f(v), rs);
      S.cur = rs; S.fresh = true; S.awaiting = false;
      return;
    }

    if (k === 'NEG') {
      if (val() === 0) return;
      S.cur = S.cur.charAt(0) === '-' ? S.cur.slice(1) : '-' + S.cur;
      S.awaiting = false;
      return;
    }

    if (k === 'BS') {
      if (S.fresh) return;
      S.cur = S.cur.slice(0, -1);
      if (S.cur === '' || S.cur === '-' || S.cur === '-0') S.cur = '0';
      return;
    }

    if (k === 'C') { reset(); return; }

    if (k === 'MC') { S.mem = 0; return; }
    if (k === 'MR') { S.cur = toStr(S.mem); S.fresh = true; S.awaiting = false; S.justEq = false; return; }
    if (k === 'M+') { S.mem = round(S.mem + val()); S.fresh = true; return; }
    if (k === 'M-') { S.mem = round(S.mem - val()); S.fresh = true; return; }
  }

  /* ---------- Scientific mode ----------
     Works like a Casio: press the function first, then the number (sin 30 =),
     with brackets and normal precedence (2 + 3 x 4 = 14). Postfix keys such as
     x^2 and n! come after the number. */
  var X = { toks: [], typing: false, done: false, res: null, ans: '0', err: null };

  var DISP = {
    pi: 'π', e: 'e', ans: 'Ans', '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^', xroot: 'ˣ√',
    'sin(': 'sin(', 'cos(': 'cos(', 'tan(': 'tan(',
    'asin(': 'sin⁻¹(', 'acos(': 'cos⁻¹(', 'atan(': 'tan⁻¹(',
    'ln(': 'ln(', 'log(': 'log(', 'sqrt(': '√(', 'cbrt(': '∛(', 'exp(': 'e^(', 'ten(': '10^(',
    sq: '²', cube: '³', recip: '⁻¹', fact: '!', pct: '%'
  };
  var NUMRE = /^-?(\d+\.?\d*|\.\d+)$/;

  function isBin(t) { return t === '+' || t === '-' || t === '*' || t === '/' || t === '^' || t === 'xroot'; }
  function isFn(t) { return t.length > 1 && t.charAt(t.length - 1) === '('; }
  function isPost(t) { return t === 'sq' || t === 'cube' || t === 'recip' || t === 'fact' || t === 'pct'; }
  function isNum(t) { return t === 'pi' || t === 'e' || t === 'ans' || NUMRE.test(t); }
  function canEnd(t) { return t !== undefined && (isNum(t) || t === ')' || isPost(t)); }
  function lastTok() { return X.toks[X.toks.length - 1]; }

  function exprText(toks, forTape) {
    return toks.map(function (t) {
      if (t === 'ans') return forTape ? fmt(X.ans) : 'Ans';
      var d = DISP[t];
      if (d === undefined) return t;
      if (t === '+' || t === '-' || t === '*' || t === '/') return ' ' + d + ' ';
      return d;
    }).join('').replace(/^ +| +$/g, '').replace(/ {2,}/g, ' ');
  }

  function chk(r) {
    if (typeof r !== 'number' || isNaN(r)) throw new Error('domain');
    if (!isFinite(r)) throw new Error('overflow');
    return r;
  }

  function factorial(v) {
    v = round(v);
    if (v < 0 || !Number.isInteger(v)) throw new Error('domain');
    if (v > 20) throw new Error('overflow');
    var r = 1;
    for (var q = 2; q <= v; q++) r *= q;
    return r;
  }

  function applyFn(t, a) {
    var r, x;
    if (t === 'sin(' || t === 'cos(' || t === 'tan(') {
      x = S.deg ? a * Math.PI / 180 : a;
      if (t === 'sin(') r = Math.sin(x);
      else if (t === 'cos(') r = Math.cos(x);
      else {
        if (Math.abs(Math.cos(x)) < 1e-10) throw new Error('undef');
        r = Math.tan(x);
      }
    } else if (t === 'asin(' || t === 'acos(' || t === 'atan(') {
      if (t !== 'atan(' && Math.abs(a) > 1) throw new Error('domain');
      r = t === 'asin(' ? Math.asin(a) : t === 'acos(' ? Math.acos(a) : Math.atan(a);
      if (S.deg) r = r * 180 / Math.PI;
    } else if (t === 'ln(' || t === 'log(') {
      if (a <= 0) throw new Error('domain');
      r = t === 'ln(' ? Math.log(a) : Math.log10(a);
    } else if (t === 'sqrt(') {
      if (a < 0) throw new Error('domain');
      r = Math.sqrt(a);
    } else if (t === 'cbrt(') {
      r = Math.cbrt(a);
    } else if (t === 'exp(') {
      r = Math.exp(a);
    } else {
      r = Math.pow(10, a);
    }
    return chk(r);
  }

  /* Recursive descent with the usual precedence:
     + -  <  x /  <  implicit multiplication and unary minus  <  ^ and roots  <  postfix keys */
  function evaluate(toks, ansVal) {
    var i = 0, n = toks.length;
    function peek() { return toks[i]; }
    function startsFactor(t) { return t !== undefined && (isNum(t) || t === '(' || isFn(t)); }

    function parseExpr() {
      var v = parseTerm();
      for (;;) {
        var t = peek();
        if (t === '+') { i++; v = chk(v + parseTerm()); }
        else if (t === '-') { i++; v = chk(v - parseTerm()); }
        else break;
      }
      return v;
    }
    function parseTerm() {
      var v = parseUnary();
      for (;;) {
        var t = peek();
        if (t === '*') { i++; v = chk(v * parseUnary()); }
        else if (t === '/') {
          i++;
          var d = parseUnary();
          if (d === 0) throw new Error('div0');
          v = chk(v / d);
        } else break;
      }
      return v;
    }
    function parseUnary() {
      var t = peek();
      if (t === '-') { i++; return -parseUnary(); }
      if (t === '+') { i++; return parseUnary(); }
      return parseImplicit();
    }
    function parseImplicit() {
      var v = parsePower();
      while (startsFactor(peek())) v = chk(v * parsePower());
      return v;
    }
    function parseExpOperand() {
      var t = peek();
      if (t === '-') { i++; return -parseExpOperand(); }
      var v = parsePostfix();
      if (peek() === '^') { i++; v = power(v, parseExpOperand()); }
      return v;
    }
    function parsePower() {
      var v = parsePostfix();
      for (;;) {
        var t = peek();
        if (t === '^') { i++; v = power(v, parseExpOperand()); }
        else if (t === 'xroot') { i++; var rad = parseExpOperand(); v = root(rad, v); }
        else break;
      }
      return chk(v);
    }
    function parsePostfix() {
      var v = parsePrimary();
      for (;;) {
        var t = peek();
        if (t === 'sq') v = chk(v * v);
        else if (t === 'cube') v = chk(v * v * v);
        else if (t === 'recip') { if (v === 0) throw new Error('div0'); v = 1 / v; }
        else if (t === 'fact') v = factorial(v);
        else if (t === 'pct') v = v / 100;
        else break;
        i++;
      }
      return v;
    }
    function parsePrimary() {
      var t = toks[i++], v;
      if (t === undefined) throw new Error('syntax');
      if (t === 'pi') return Math.PI;
      if (t === 'e') return Math.E;
      if (t === 'ans') return ansVal;
      if (NUMRE.test(t)) return parseFloat(t);
      if (t === '(') {
        v = parseExpr();
        if (peek() === ')') i++;
        return v;
      }
      if (isFn(t)) {
        v = parseExpr();
        if (peek() === ')') i++;
        return applyFn(t, v);
      }
      throw new Error('syntax');
    }

    var result = parseExpr();
    if (i < n) throw new Error('syntax');
    return result;
  }

  function sciEval(toks) { return evaluate(toks, parseFloat(X.ans)); }

  /* Running value shown while typing: the expression so far, without a dangling operator. */
  function sciPreview() {
    var tk = X.toks.slice();
    while (tk.length && isBin(tk[tk.length - 1])) tk.pop();
    if (!tk.length) return null;
    try { return toStr(sciEval(tk)); } catch (e) { return null; }
  }

  function sciValue() {
    if (X.done) return parseFloat(X.res);
    var pv = sciPreview();
    return pv === null ? null : parseFloat(pv);
  }

  function unclosed() {
    var c = 0;
    X.toks.forEach(function (t) {
      if (t === '(' || isFn(t)) c++;
      else if (t === ')') c--;
    });
    return c;
  }

  /* Brackets left open are closed for the person, as on a Casio. */
  function sciClose() {
    if (!X.toks.length || !canEnd(lastTok())) return;
    for (var n = unclosed(); n > 0; n--) X.toks.push(')');
  }

  function sciEquals(record) {
    sciClose();
    var rs = toStr(sciEval(X.toks));
    var plain = X.toks.length === 1 && NUMRE.test(X.toks[0]);
    if (record && !plain) pushTape(exprText(X.toks, true) + ' =', rs);
    X.res = rs; X.ans = rs; X.done = true; X.typing = false;
  }

  function sciFresh() {
    if (X.done) { X.toks = []; X.done = false; X.res = null; X.typing = false; }
  }
  function sciUseAns() {
    if (X.done) { X.toks = ['ans']; X.done = false; X.res = null; X.typing = false; }
  }
  function sciBin(b) {
    sciUseAns();
    if (!X.toks.length) {
      if (b === '-') { X.toks.push('-'); X.typing = false; return; }
      X.toks.push('ans');
    }
    var t = lastTok();
    if (canEnd(t)) X.toks.push(b);
    else if (isBin(t)) {
      if (b === '-' && t !== '-' && t !== '+') X.toks.push(b);
      else X.toks[X.toks.length - 1] = b;
    } else if (b === '-') X.toks.push(b);
    X.typing = false;
  }
  function sciPost(p) {
    sciUseAns();
    if (!X.toks.length) X.toks.push('ans');
    if (!canEnd(lastTok())) return;
    X.toks.push(p);
    X.typing = false;
  }
  function sciFn(t) { sciFresh(); X.toks.push(t); X.typing = false; }

  var FNKEYS = {
    SIN: ['sin(', 'asin('], COS: ['cos(', 'acos('], TAN: ['tan(', 'atan('],
    LN: ['ln(', 'exp('], LOG: ['log(', 'ten('], SQRT: ['sqrt(', 'sqrt('],
    CBRT: ['cbrt(', 'cbrt('], EXP: ['exp(', 'exp('], TEN: ['ten(', 'ten(']
  };

  function sciPress(k) {
    var wasErr = !!X.err, c, v, fr, rs;
    X.err = null;
    S.notice = '';
    if (k !== 'FRAC' && k !== 'DEG' && k !== 'INV') S.fracMode = null;
    if (wasErr && k === 'BS') return;

    if (/^[0-9]$/.test(k) || k === '.') {
      sciFresh();
      if (X.typing) {
        c = lastTok();
        if (k === '.') { if (c.indexOf('.') < 0 && digits(c) < MAXD) c += '.'; }
        else if (digits(c) < MAXD) c = c === '0' ? k : c === '-0' ? '-' + k : c + k;
        X.toks[X.toks.length - 1] = c;
      } else {
        X.toks.push(k === '.' ? '0.' : k);
        X.typing = true;
      }
      return;
    }

    if (k === '+' || k === '-' || k === '*' || k === '/') { sciBin(k); return; }
    if (k === 'POW') { c = S.inv ? 'xroot' : '^'; S.inv = false; sciBin(c); return; }
    if (k === 'ROOT') { S.inv = false; sciBin('xroot'); return; }
    if (FNKEYS[k]) { sciFn(FNKEYS[k][S.inv ? 1 : 0]); S.inv = false; return; }
    if (k === 'SQ') { if (S.inv) sciFn('sqrt('); else sciPost('sq'); S.inv = false; return; }
    if (k === 'CUBE') { if (S.inv) sciFn('cbrt('); else sciPost('cube'); S.inv = false; return; }
    if (k === 'RECIP') { sciPost('recip'); return; }
    if (k === 'FACT') { sciPost('fact'); return; }
    if (k === '%') { sciPost('pct'); return; }

    if (k === 'LPAREN') { sciFresh(); X.toks.push('('); X.typing = false; return; }
    if (k === 'RPAREN') {
      if (unclosed() > 0 && canEnd(lastTok())) { X.toks.push(')'); X.typing = false; }
      return;
    }
    if (k === 'PI' || k === 'E') { sciFresh(); X.toks.push(k === 'PI' ? 'pi' : 'e'); X.typing = false; return; }

    if (k === 'NEG') {
      if (X.typing) {
        c = lastTok();
        X.toks[X.toks.length - 1] = c.charAt(0) === '-' ? c.slice(1) : '-' + c;
      } else if (X.done) {
        X.toks = ['-', 'ans']; X.done = false; X.res = null;
      } else if (!X.toks.length || !canEnd(lastTok())) {
        X.toks.push('-');
      }
      return;
    }

    if (k === 'BS') {
      if (X.done) { X.done = false; X.res = null; return; }
      if (!X.toks.length) return;
      if (X.typing) {
        c = lastTok().slice(0, -1);
        if (c === '' || c === '-') X.toks.pop();
        else { X.toks[X.toks.length - 1] = c; return; }
      } else {
        X.toks.pop();
      }
      X.typing = X.toks.length > 0 && NUMRE.test(lastTok());
      return;
    }

    if (k === 'C') {
      X.toks = []; X.typing = false; X.done = false; X.res = null; S.inv = false;
      return;
    }

    if (k === 'DEG') { S.deg = !S.deg; return; }
    if (k === 'INV') { S.inv = !S.inv; return; }

    if (k === 'MC') { S.mem = 0; return; }
    if (k === 'MR') { sciFresh(); X.toks.push(toStr(S.mem)); X.typing = false; return; }
    if (k === 'M+' || k === 'M-') {
      if (!X.done) {
        if (!X.toks.length) return;
        sciEquals(true);
      }
      v = parseFloat(X.res);
      S.mem = round(S.mem + (k === 'M+' ? v : -v));
      return;
    }

    if (k === 'FRAC') {
      if (S.fracMode === 'mixed') { S.fracMode = 'improper'; return; }
      if (S.fracMode === 'improper') { S.fracMode = null; return; }
      if (!X.done) {
        if (!X.toks.length) return;
        sciEquals(false);
      }
      fr = toFraction(parseFloat(X.res));
      if (fr === null) { S.notice = 'nofrac'; return; }
      if (fr.kind === 'int') { S.notice = 'int'; return; }
      S.frac = fr;
      S.fracMode = fr.whole > 0 ? 'mixed' : 'improper';
      return;
    }

    if (k === '=') {
      if (X.done || !X.toks.length) return;
      sciEquals(true);
      return;
    }
  }

  function sciView() {
    var base = { mem: S.mem !== 0, deg: S.deg, inv: S.inv, frac: null, isMsg: false, err: false };
    if (X.err) {
      base.main = 'E'; base.top = ERR[X.err]; base.isMsg = true; base.err = true;
      return base;
    }
    var top = X.toks.length ? exprText(X.toks, false) : '';
    if (X.done) top += ' =';
    if (S.notice) { top = NOTICE[S.notice]; base.isMsg = true; }
    base.top = top;
    if (X.done && S.fracMode) {
      var p = fracParts();
      base.frac = p;
      base.main = p.lead + (/\d$/.test(p.lead) ? ' ' : '') + p.top + '/' + p.bot;
    } else if (X.done) {
      base.main = fmt(X.res);
    } else if (X.typing) {
      base.main = fmt(lastTok());
    } else {
      var pv = sciPreview();
      base.main = pv === null ? '0' : fmt(pv);
    }
    return base;
  }

  function setMode(m) {
    S.mode = m === 'sci' ? 'sci' : 'basic';
    S.fracMode = null; S.inv = false; S.notice = ''; X.err = null;
  }

  function press(k) {
    if (S.mode === 'sci') {
      try { sciPress(k); }
      catch (e) { X.err = ERR[e.message] ? e.message : 'syntax'; }
      return;
    }
    if (S.err) { if (k === 'C') reset(); return; }
    try { handle(k); }
    catch (e) { S.err = ERR[e.message] ? e.message : 'overflow'; }
  }

  function recall(res) {
    if (S.mode === 'sci') {
      X.err = null;
      sciFresh();
      X.toks.push(res);
      X.typing = false;
      return;
    }
    if (S.err) return;
    S.cur = res; S.fresh = true; S.awaiting = false; S.justEq = false;
  }

  function view() {
    if (S.mode === 'sci') return sciView();
    var m = S.mem !== 0;
    var base = { mem: m, deg: S.deg, inv: S.inv, frac: null };
    if (S.err) {
      base.main = 'E'; base.top = ERR[S.err]; base.isMsg = true; base.err = true;
      return base;
    }
    var top = '', isMsg = false;
    if (S.notice) { top = NOTICE[S.notice]; isMsg = true; }
    else if (S.op !== null) top = f(S.acc) + ' ' + SYM[S.op];
    else if (S.justEq) top = S.lastExpr;
    base.top = top; base.isMsg = isMsg; base.err = false;
    if (S.fracMode) {
      var p = fracParts();
      base.frac = p;
      base.main = p.lead + (/\d$/.test(p.lead) ? ' ' : '') + p.top + '/' + p.bot;
    } else {
      base.main = fmt(S.cur);
    }
    return base;
  }

  return {
    press: press,
    setMode: setMode,
    recall: recall,
    view: view,
    fmt: fmt,
    tape: function () { return S.tape; },
    clearTape: function () { S.tape = []; S.lastExpr = ''; },
    persist: function () { return { mem: S.mem, tape: S.tape, deg: S.deg }; }
  };
}

/* ---------- Interface ---------- */
if (typeof document === 'undefined') {
  module.exports = { createCalc: createCalc };
} else {
  (function () {
    var KEY = 'deskcalc.v1';
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    var calc = createCalc(saved || {});

    var $ = function (id) { return document.getElementById(id); };
    var stage = $('stage'), num = $('num'), expr = $('expr');
    var fM = $('fM'), fE = $('fE'), mInv = $('mInv'), mDeg = $('mDeg');
    var kSin = $('kSin'), kCos = $('kCos'), kTan = $('kTan');
    var altKeys = Array.prototype.slice.call(document.querySelectorAll('.k[data-alt]'));
    altKeys.forEach(function (b) { b.setAttribute('data-main', b.innerHTML); });
    var list = $('tapeList'), empty = $('tapeEmpty');
    var shownTape = -1;

    var calcEl = $('calc');
    var mode = saved && saved.mode === 'sci' ? 'sci' : 'basic';

    function save() {
      try {
        var p = calc.persist();
        p.mode = mode;
        localStorage.setItem(KEY, JSON.stringify(p));
      } catch (e) {}
    }

    function setMode(m) {
      mode = m;
      calc.setMode(m);
      calcEl.setAttribute('data-mode', m);
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-m') === m ? 'true' : 'false');
      });
    }

    document.querySelector('.seg').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-m]');
      if (!b) return;
      setMode(b.getAttribute('data-m'));
      render();
      save();
    });

    function renderTape() {
      var t = calc.tape();
      var sig = t.length + ':' + (t.length ? t[t.length - 1].expr + t[t.length - 1].res : '');
      if (sig === shownTape) return;
      shownTape = sig;
      Array.prototype.slice.call(list.querySelectorAll('.row')).forEach(function (n) { n.remove(); });
      empty.hidden = t.length > 0;
      t.forEach(function (r, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'row';
        b.setAttribute('data-i', String(i));
        var e = document.createElement('span'); e.className = 'expr'; e.textContent = r.expr;
        var s = document.createElement('span'); s.className = 'res'; s.textContent = calc.fmt(r.res);
        b.setAttribute('aria-label', 'استخدام النتيجة ' + calc.fmt(r.res));
        b.appendChild(e); b.appendChild(s);
        list.appendChild(b);
      });
      list.scrollTop = list.scrollHeight;
    }

    function render() {
      var v = calc.view();
      num.textContent = '';
      num.setAttribute('aria-label', v.main);
      if (v.frac) {
        num.classList.add('is-frac');
        if (v.frac.lead) {
          var lead = document.createElement('span');
          lead.className = 'lead';
          lead.textContent = v.frac.lead;
          num.appendChild(lead);
        }
        var fr = document.createElement('span');
        fr.className = 'fr';
        var t = document.createElement('span'); t.className = 'top'; t.textContent = v.frac.top;
        var d = document.createElement('span'); d.className = 'bot'; d.textContent = v.frac.bot;
        fr.appendChild(t); fr.appendChild(d);
        num.appendChild(fr);
        var w = v.frac.lead.length + Math.max(v.frac.top.length, v.frac.bot.length) * 0.5 + 1;
        num.style.setProperty('--n', String(Math.max(6, w)));
      } else {
        num.classList.remove('is-frac');
        num.textContent = v.main;
        num.style.setProperty('--n', String(Math.max(8, v.main.length)));
      }
      mDeg.textContent = v.deg ? 'DEG' : 'RAD';
      mInv.className = 'mode' + (v.inv ? ' on' : '');
      kSin.textContent = v.inv ? 'sin⁻¹' : 'sin';
      kCos.textContent = v.inv ? 'cos⁻¹' : 'cos';
      kTan.textContent = v.inv ? 'tan⁻¹' : 'tan';
      altKeys.forEach(function (b) {
        b.innerHTML = b.getAttribute(v.inv ? 'data-alt' : 'data-main');
      });
      expr.textContent = v.top;
      expr.className = 'expr' + (v.isMsg ? ' msg' : '');
      expr.dir = v.isMsg ? 'rtl' : 'ltr';
      if (!v.isMsg) expr.scrollLeft = expr.scrollWidth;
      fM.className = v.mem ? 'on' : '';
      fE.className = v.err ? 'on' : '';
      renderTape();
    }

    function press(k) { calc.press(k); render(); save(); }

    document.querySelector('.calc').addEventListener('click', function (ev) {
      var b = ev.target.closest('button[data-k]');
      if (b) press(b.getAttribute('data-k'));
    });

    list.addEventListener('click', function (ev) {
      var b = ev.target.closest('.row');
      if (!b) return;
      var r = calc.tape()[parseInt(b.getAttribute('data-i'), 10)];
      if (!r) return;
      calc.recall(r.res);
      stage.classList.remove('tape-open');
      render();
    });

    $('tapeClear').addEventListener('click', function () { calc.clearTape(); render(); save(); });
    $('tapeOpen').addEventListener('click', function () { stage.classList.add('tape-open'); });
    $('tapeClose').addEventListener('click', function () { stage.classList.remove('tape-open'); });

    var MAP = { ',': '.', 'x': '*', 'X': '*', 'Enter': '=', 'Escape': 'C', 'c': 'C', 'C': 'C', 'Backspace': 'BS', 'Delete': 'BS', 'p': 'PI', 'P': 'PI', '^': 'POW', '!': 'FACT', '(': 'LPAREN', ')': 'RPAREN' };
    document.addEventListener('keydown', function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      var k = ev.key;
      if (MAP[k]) k = MAP[k];
      if (!/^([0-9.+\-*\/=%]|C|BS|PI|POW|FACT|LPAREN|RPAREN)$/.test(k)) return;
      if (mode === 'basic' && /^(PI|POW|FACT|LPAREN|RPAREN)$/.test(k)) return;
      ev.preventDefault();
      press(k);
      var btn = document.querySelector('.keys button[data-k="' + k + '"]');
      if (btn) {
        btn.classList.add('pressed');
        setTimeout(function () { btn.classList.remove('pressed'); }, 110);
      }
    });

    setMode(mode);
    render();
  })();
}
</script>

</body></html>
